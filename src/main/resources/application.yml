spring:
  application:
    name: ordexaflow-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://127.0.0.1:5433/ordexaflow}
    username: ${DB_USERNAME:ordexaflow}
    password: ${DB_PASSWORD:ordexaflow-local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
