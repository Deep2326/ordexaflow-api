services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-ordexaflow}
      POSTGRES_USER: ${DB_USERNAME:-ordexaflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ordexaflow-local}
    ports:
      - "5433:5432"
    volumes:
      - ordexaflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ordexaflow-postgres-data:
